version: '3.8'

services:
  nextin-landing-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nextin-landing-page-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    command: npm run dev
    restart: unless-stopped

